<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#faf6ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1c1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf6ef;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #ece6db;border-radius:18px;padding:32px 28px;">
            <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.3px;">TabeDog</td></tr>
            <tr><td style="padding-top:20px;font-size:18px;font-weight:700;">Confirm your email</td></tr>
            <tr><td style="padding-top:8px;font-size:14px;line-height:1.5;color:#6f736f;">Tap the button to confirm {{ .Email }}. You’ll go straight to the map, signed in.</td></tr>
            <tr>
              <td style="padding-top:24px;">
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:block;text-align:center;background:#ff6347;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 20px;border-radius:14px;">Confirm and open the map</a>
              </td>
            </tr>
            <tr><td style="padding-top:20px;font-size:12px;line-height:1.5;color:#6f736f;">If you didn’t create a TabeDog account, you can ignore this email.</td></tr>
          </table>
          <p style="font-size:12px;color:#6f736f;margin:16px 0 0;">いただきます · tabedog.com</p>
        </td>
      </tr>
    </table>
  </body>
</html>
